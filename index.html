<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de Droits et Taxes à l'Importation - Algérie</title>
<style>
:root {
  --primary: #006233;
  --primary-light: #008847;
  --primary-dark: #004d28;
  --accent: #D21034;
  --accent-light: #e8385a;
  --gold: #F0C808;
  --gold-light: #f5d84d;
  --bg: #f7f9fc;
  --card: #ffffff;
  --text: #1a2332;
  --text-light: #5a6a7e;
  --border: #e2e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* Language Switcher */
.lang-switcher {
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 10;
  display: flex;
  gap: 4px;
}
.lang-btn {
  padding: 4px 10px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.12);
  color: white;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  backdrop-filter: blur(4px);
}
.lang-btn:hover { background: rgba(255,255,255,0.25); }
.lang-btn.active {
  background: white;
  color: var(--primary);
  border-color: white;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  padding: 32px 20px 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
  animation: headerGlow 15s ease-in-out infinite;
}
@keyframes headerGlow {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(5%, 5%); }
}
.header-content { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.header .subtitle {
  font-size: 0.95rem;
  opacity: 0.9;
  font-weight: 400;
}
.header .flag-bar {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: 14px;
}
.flag-bar span {
  display: inline-block;
  width: 32px; height: 6px;
  border-radius: 3px;
}
.flags-g { background: var(--primary); }
.flags-w { background: #fff; }
.flags-r { background: var(--accent); }
.header .update-badge {
  display: inline-block;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(4px);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.78rem;
  margin-top: 10px;
  border: 1px solid rgba(255,255,255,0.2);
}

/* Container */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  transition: box-shadow 0.2s;
}
.card:hover { box-shadow: var(--shadow-lg); }
.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--primary);
}
.card-title .icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-size: 1rem;
  flex-shrink: 0;
}

/* Form */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-group.full { grid-column: 1 / -1; }
.form-group label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-light);
}
.form-group label .required {
  color: var(--accent);
  margin-left: 2px;
}
.form-group input, .form-group select {
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: #fff;
  color: var(--text);
  font-family: inherit;
  width: 100%;
}
.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0,98,51,0.12);
}
.form-group input::placeholder { color: #b0b8c4; }

/* Buttons */
.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  flex: 1;
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-light), var(--primary));
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,98,51,0.3);
}
.btn-secondary {
  background: var(--bg);
  color: var(--text-light);
  border: 2px solid var(--border);
}
.btn-secondary:hover { background: #eef0f4; }

/* Results */
.results { display: none; }
.results.visible { display: block; }
.result-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 20px;
}
.summary-item {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  padding: 18px 16px;
  border-radius: var(--radius-sm);
  text-align: center;
}
.summary-item.accent { background: linear-gradient(135deg, var(--accent), var(--accent-light)); }
.summary-item.gold { background: linear-gradient(135deg, #c99700, var(--gold)); color: var(--text); }
.summary-item .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.9; margin-bottom: 6px; }
.summary-item.gold .label { opacity: 0.7; }
.summary-item .value { font-size: 1.35rem; font-weight: 800; }
.summary-item.gold .value { color: var(--primary-dark); }

/* Breakdown table */
.breakdown-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.breakdown-table th { background: #f1f5f9; padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid var(--border); }
.breakdown-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.breakdown-table tr:last-child td { border-bottom: none; }
.breakdown-table tr:hover td { background: #f8fafc; }
.breakdown-table .tax-name { font-weight: 500; }
.breakdown-table .tax-base { color: var(--text-light); font-size: 0.83rem; }
.breakdown-table .tax-rate { text-align: center; font-weight: 600; color: var(--primary); }
.breakdown-table .tax-amount { text-align: right; font-weight: 700; white-space: nowrap; }
.breakdown-table .total-row td { font-weight: 800; font-size: 1rem; background: #f0fdf4; border-top: 2px solid var(--primary); color: var(--primary-dark); }
.breakdown-table .total-row .tax-amount { color: var(--accent); font-size: 1.1rem; }

/* Bar */
.bar-container { height: 28px; border-radius: 14px; overflow: hidden; display: flex; background: #e2e8f0; }
.bar-segment { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: white; transition: width 0.6s ease; min-width: 0; overflow: hidden; }
.bar-dd { background: var(--primary); } .bar-tcs { background: #3b82f6; } .bar-tva { background: var(--accent); } .bar-daps { background: #8b5cf6; } .bar-tdb { background: #f59e0b; color: var(--text); } .bar-cif { background: #94a3b8; }
.bar-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 0.75rem; color: var(--text-light); }
.bar-legend span { display: flex; align-items: center; gap: 4px; }
.bar-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* Pain & Tips */
.pain-points { background: linear-gradient(135deg, #fef3f2, #fff5f5); border: 1px solid #fecaca; }
.pain-points .card-title { color: var(--accent); }
.pain-points .card-title .icon { background: linear-gradient(135deg, var(--accent), var(--accent-light)); }
.pain-list, .tips-list { list-style: none; display: grid; gap: 12px; }
.pain-list li, .tips-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; }
.pain-list li .pain-icon { flex-shrink: 0; width: 24px; height: 24px; background: var(--accent); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; margin-top: 2px; }
.tips { background: linear-gradient(135deg, #f0fdf4, #ecfdf5); border: 1px solid #bbf7d0; }
.tips .card-title { color: var(--primary-dark); }
.tips-list li .tip-icon { flex-shrink: 0; width: 24px; height: 24px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; margin-top: 2px; }

/* CTA */
.cta-card { background: linear-gradient(135deg, var(--gold-light), var(--gold)); border: 2px solid #c99700; text-align: center; }
.cta-card .card-title { justify-content: center; color: var(--primary-dark); }
.cta-card .card-title .icon { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); }
.cta-card p { margin-bottom: 14px; font-size: 0.92rem; color: var(--text); }
.cta-btn { display: inline-block; padding: 12px 32px; background: var(--primary); color: white; border-radius: var(--radius-sm); font-weight: 700; text-decoration: none; font-size: 0.95rem; transition: all 0.2s; border: none; cursor: pointer; font-family: inherit; }
.cta-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,98,51,0.3); }

/* Footer */
.footer { text-align: center; padding: 20px; font-size: 0.78rem; color: var(--text-light); border-top: 1px solid var(--border); background: var(--card); }
.footer a { color: var(--primary); text-decoration: none; }

/* Tooltip */
.tooltip-trigger { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--border); color: var(--text-light); font-size: 0.65rem; font-weight: 700; cursor: help; margin-left: 4px; vertical-align: middle; position: relative; }
.tooltip-trigger:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 6px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 400; z-index: 10; max-width: 260px; white-space: normal; line-height: 1.4; }

/* Rate info */
.rate-info { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-sm); font-size: 0.82rem; color: var(--primary-dark); margin-top: 12px; }
.rate-info .dot-pulse { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* DAPS warning */
.daps-warning { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius-sm); font-size: 0.82rem; color: #92400e; margin-top: 8px; }
.daps-warning .warn-icon { flex-shrink: 0; font-size: 1rem; }

/* Comparison box */
.comparison-box { margin-top: 16px; padding: 14px; background: #f8fafc; border-radius: var(--radius-sm); border: 1px dashed var(--border); }
.comparison-title { font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 8px; }
.comparison-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 0.85rem; }
.comparison-row .label { color: var(--text-light); }
.comparison-row .savings { color: var(--primary); font-weight: 700; }

/* Ad banner responsive */
.ad-compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 18px; }

/* Animations */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.results.visible .card { animation: fadeInUp 0.4s ease both; }
.results.visible .card:nth-child(2) { animation-delay: 0.1s; }
.results.visible .card:nth-child(3) { animation-delay: 0.2s; }

/* Print */
@media print {
  .header { background: var(--primary) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .btn-row, .cta-card, .lang-switcher { display: none; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
}

/* ===== Mobile ===== */
@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .result-summary { grid-template-columns: 1fr; }
  .header h1 { font-size: 1.2rem; }
  .header .subtitle { font-size: 0.85rem; }
  .header { padding: 28px 16px 22px; }
  .summary-item .value { font-size: 1.1rem; }
  .container { padding: 14px 10px 32px; }
  .card { padding: 16px 12px; margin-bottom: 14px; }
  .card-title { font-size: 1rem; margin-bottom: 14px; }
  .breakdown-table { font-size: 0.78rem; }
  .breakdown-table th, .breakdown-table td { padding: 8px 6px; }
  .breakdown-table .tax-base { display: none; }
  .btn { padding: 12px 16px; font-size: 0.9rem; }
  .btn-primary { width: 100%; }
  .lang-switcher { top: 8px; right: 8px; gap: 2px; }
  .lang-btn { padding: 3px 7px; font-size: 0.68rem; }
  .ad-compare { grid-template-columns: 1fr; gap: 8px; }
  .ad-compare .arrow-mobile { display: none; }
  .ad-compare > div { display: inline-flex; align-items: center; gap: 10px; }
  .rate-info { font-size: 0.72rem; flex-wrap: wrap; }
  .pain-list li, .tips-list li { font-size: 0.82rem; }
  .cta-btn { padding: 12px 20px; font-size: 0.88rem; }
  .comparison-box { padding: 10px; }
}

/* ===== Tablet ===== */
@media (min-width: 641px) and (max-width: 900px) {
  .container { padding: 20px 14px 36px; }
  .header h1 { font-size: 1.4rem; }
}

/* RTL support for Arabic */
[dir="rtl"] .form-group label .required { margin-left: 0; margin-right: 2px; }
[dir="rtl"] .tooltip-trigger { margin-left: 0; margin-right: 4px; }
[dir="rtl"] .breakdown-table th, [dir="rtl"] .breakdown-table td { text-align: right; }
[dir="rtl"] .breakdown-table .tax-amount { text-align: left; }
[dir="rtl"] .comparison-row { flex-direction: row-reverse; }
[dir="rtl"] .pain-list li, [dir="rtl"] .tips-list li { flex-direction: row-reverse; text-align: right; }
[dir="rtl"] .lang-switcher { right: auto; left: 16px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="lang-switcher">
    <button class="lang-btn" onclick="setLang('ar')">عربي</button>
    <button class="lang-btn active" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
  <div class="header-content">
    <div class="flag-bar">
      <span class="flags-g"></span>
      <span class="flags-w"></span>
      <span class="flags-r"></span>
    </div>
    <h1 data-i18n="h1"></h1>
    <p class="subtitle" data-i18n="subtitle"></p>
    <span class="update-badge" data-i18n="updateBadge"></span>
  </div>
</div>

<div class="container">

  <!-- Calculator Form -->
  <div class="card">
    <div class="card-title">
      <span class="icon">📦</span>
      <span data-i18n="formTitle"></span>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label data-i18n="labelFob"></label>
        <input type="number" id="fobValue" data-i18n-placeholder="phFob" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label data-i18n="labelCurrency"></label>
        <select id="currency">
          <option value="EUR">EUR — Euro</option>
          <option value="USD">USD — Dollar</option>
          <option value="CNY">CNY — Yuan</option>
          <option value="GBP">GBP — Pound</option>
          <option value="TRY">TRY — Lira</option>
          <option value="DZD" selected>DZD — Dinar</option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="labelFreight"></label>
        <input type="number" id="freight" placeholder="0" min="0" step="0.01" value="0">
      </div>
      <div class="form-group">
        <label data-i18n="labelInsurance"></label>
        <input type="number" id="insurance" placeholder="0" min="0" step="0.01" value="0">
      </div>
      <div class="form-group full">
        <label data-i18n="labelDd"></label>
        <select id="ddRate">
          <option value="0">0% — Exempted</option>
          <option value="5" selected>5% — Raw materials</option>
          <option value="15">15% — Semi-finished</option>
          <option value="30">30% — Consumer goods</option>
          <option value="60">60% — Luxury / Discouraged</option>
        </select>
      </div>
      <div class="form-group full">
        <label data-i18n="labelTva"></label>
        <select id="tvaRate">
          <option value="19" selected>19% — Standard</option>
          <option value="9">9% — Reduced</option>
          <option value="0">0% — Exempt</option>
        </select>
      </div>
      <div class="form-group full">
        <label data-i18n="labelDaps"></label>
        <select id="dapsRate">
          <option value="0" selected>0% — Not applicable</option>
          <option value="30">30%</option><option value="50">50%</option><option value="70">70%</option>
          <option value="100">100%</option><option value="120">120%</option><option value="150">150%</option><option value="200">200%</option>
        </select>
      </div>
      <div class="form-group full">
        <label data-i18n="labelImportType"></label>
        <select id="importType">
          <option value="goods" selected>Goods (TDB: 0.5%)</option>
          <option value="services">Services (TDB: 4%)</option>
          <option value="intangible">Intangible (TDB: 5%)</option>
        </select>
      </div>
    </div>

    <div class="daps-warning" id="dapsWarning" style="display:none;">
      <span class="warn-icon">⚠️</span>
      <span data-i18n="dapsWarning"></span>
    </div>

    <div class="rate-info">
      <span class="dot-pulse"></span>
      <span id="rateDisplay">1 EUR = 145.20 DZD | 1 USD = 134.50 DZD | 1 CNY = 18.50 DZD</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="calculate()" data-i18n="btnCalculate"></button>
      <button class="btn btn-secondary" onclick="resetForm()" data-i18n="btnReset"></button>
    </div>
  </div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="card">
      <div class="card-title"><span class="icon">💰</span><span data-i18n="costSummary"></span></div>
      <div class="result-summary">
        <div class="summary-item"><div class="label" data-i18n="cifValue"></div><div class="value" id="cifDisplay">—</div></div>
        <div class="summary-item accent"><div class="label" data-i18n="totalTaxLabel"></div><div class="value" id="totalTaxDisplay">—</div></div>
        <div class="summary-item gold"><div class="label" data-i18n="totalCostLabel"></div><div class="value" id="totalCostDisplay">—</div></div>
      </div>
      <div style="text-align:center;margin-top:4px;"><span style="font-size:0.82rem;color:var(--text-light);" id="effectiveRateDisplay"></span></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📊</span><span data-i18n="detailTitle"></span></div>
      <table class="breakdown-table">
        <thead><tr>
          <th data-i18n="thTax"></th>
          <th class="tax-base-col" data-i18n="thBase"></th>
          <th data-i18n="thRate"></th>
          <th data-i18n="thAmount"></th>
        </tr></thead>
        <tbody id="breakdownBody"></tbody>
      </table>
      <div class="tax-bar" style="margin-top:16px;">
        <div class="tax-bar-label" data-i18n="costComposition"></div>
        <div class="bar-container" id="taxBar"></div>
        <div class="bar-legend" id="barLegend"></div>
      </div>
      <div class="comparison-box" id="eur1Box" style="display:none;">
        <div class="comparison-title" data-i18n="eur1Title"></div>
        <div class="comparison-row"><span class="label" data-i18n="eur1Dd"></span><span class="savings" id="eur1Savings">—</span></div>
        <div class="comparison-row"><span class="label" data-i18n="eur1Tva"></span><span class="savings" id="eur1TvaSavings">—</span></div>
        <div class="comparison-row" style="font-weight:700;font-size:0.92rem;border-top:1px solid var(--border);padding-top:8px;margin-top:4px;"><span class="label" data-i18n="eur1Total"></span><span class="savings" id="eur1TotalSavings">—</span></div>
      </div>
    </div>

    <div class="card pain-points">
      <div class="card-title"><span class="icon">⚡</span><span data-i18n="painTitle"></span></div>

let currentLang = 'fr';

function setLang(lang) {
  currentLang = lang;
  const t = i18n[lang];
  const isRTL = lang === 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = isRTL ? 'rtl' : 'ltr';

  // Update lang buttons
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');

  // Text content
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });
  // Placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key] !== undefined) el.placeholder = t[key];
  });

  // Update select options
  const ddSel = document.getElementById('ddRate');
  ddSel.options[0].text = t.dd0; ddSel.options[1].text = t.dd5;
  ddSel.options[2].text = t.dd15; ddSel.options[3].text = t.dd30; ddSel.options[4].text = t.dd60;
  const tvaSel = document.getElementById('tvaRate');
  tvaSel.options[0].text = t.tva19; tvaSel.options[1].text = t.tva9; tvaSel.options[2].text = t.tva0;
  const dapsSel = document.getElementById('dapsRate');
  dapsSel.options[0].text = t.daps0;
  const impSel = document.getElementById('importType');
  impSel.options[0].text = t.impGoods; impSel.options[1].text = t.impServices; impSel.options[2].text = t.impIntangible;
}

// ===== EXCHANGE RATES =====
const rates = { EUR: 145.20, USD: 134.50, CNY: 18.50, GBP: 171.00, TRY: 3.50, DZD: 1 };

function formatDZD(num) {
  if (num === 0) return '0,00';
  return new Intl.NumberFormat('fr-DZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
}

function t(key) { return i18n[currentLang][key] || key; }

document.getElementById('dapsRate').addEventListener('change', function() {
  document.getElementById('dapsWarning').style.display = parseFloat(this.value) > 0 ? 'flex' : 'none';
});

function calculate() {
  const fobRaw = parseFloat(document.getElementById('fobValue').value);
  if (!fobRaw || fobRaw <= 0) { alert(t('alertFob')); return; }

  const currency = document.getElementById('currency').value;
  const freightRaw = parseFloat(document.getElementById('freight').value) || 0;
  const insuranceRaw = parseFloat(document.getElementById('insurance').value) || 0;
  const ddRate = parseFloat(document.getElementById('ddRate').value) / 100;
  const tvaRate = parseFloat(document.getElementById('tvaRate').value) / 100;
  const dapsRate = parseFloat(document.getElementById('dapsRate').value) / 100;
  const importType = document.getElementById('importType').value;
  const rate = rates[currency] || 1;

  const fobDZD = fobRaw * rate;
  const freightDZD = freightRaw * rate;
  const insuranceDZD = insuranceRaw * rate;
  const cifDZD = fobDZD + freightDZD + insuranceDZD;
  const dd = cifDZD * ddRate;
  const tcs = cifDZD * 0.02;
  const daps = cifDZD * dapsRate;
  let tdb = 0, tdbRateStr = '';
  if (importType === 'goods') { tdb = Math.max(cifDZD * 0.005, 20000); tdbRateStr = '0.5% (min 20,000)'; }
  else if (importType === 'services') { tdb = cifDZD * 0.04; tdbRateStr = '4%'; }
  else { tdb = cifDZD * 0.05; tdbRateStr = '5%'; }
  const tvaBase = cifDZD + dd + tcs + daps;
  const tva = tvaBase * tvaRate;
  const totalTax = dd + tcs + daps + tdb + tva;
  const totalCost = cifDZD + totalTax;
  const effectiveRate = (totalTax / cifDZD) * 100;

  document.getElementById('cifDisplay').textContent = formatDZD(cifDZD) + ' DZD';
  document.getElementById('totalTaxDisplay').textContent = formatDZD(totalTax) + ' DZD';
  document.getElementById('totalCostDisplay').textContent = formatDZD(totalCost) + ' DZD';
  document.getElementById('effectiveRateDisplay').textContent = `${t('effectiveRate')}: ${effectiveRate.toFixed(1)}% ${t('ofCif')}`;

  let rows = '';
  rows += `<tr><td class="tax-name">${t('cifRow')}</td><td class="tax-base">${t('cifBase')}</td><td class="tax-rate">—</td><td class="tax-amount">${formatDZD(cifDZD)}</td></tr>`;
  rows += `<tr><td class="tax-name">${t('ddRow')}</td><td class="tax-base">CIF × ${(ddRate*100).toFixed(0)}%</td><td class="tax-rate">${(ddRate*100).toFixed(0)}%</td><td class="tax-amount">${formatDZD(dd)}</td></tr>`;
  rows += `<tr><td class="tax-name">${t('tcsRow')}</td><td class="tax-base">CIF × 2%</td><td class="tax-rate">2%</td><td class="tax-amount">${formatDZD(tcs)}</td></tr>`;
  if (dapsRate > 0) rows += `<tr><td class="tax-name">${t('dapsRow')}</td><td class="tax-base">CIF × ${(dapsRate*100).toFixed(0)}%</td><td class="tax-rate" style="color:var(--accent);">${(dapsRate*100).toFixed(0)}%</td><td class="tax-amount" style="color:var(--accent);">${formatDZD(daps)}</td></tr>`;
  rows += `<tr><td class="tax-name">${t('tdbRow')}</td><td class="tax-base">${tdbRateStr}</td><td class="tax-rate">${tdbRateStr}</td><td class="tax-amount">${formatDZD(tdb)}</td></tr>`;
  rows += `<tr><td class="tax-name">${t('tvaRow')}</td><td class="tax-base">(CIF+DD+TCS${dapsRate>0?'+DAPS':''}) × ${(tvaRate*100).toFixed(0)}%</td><td class="tax-rate">${(tvaRate*100).toFixed(0)}%</td><td class="tax-amount">${formatDZD(tva)}</td></tr>`;
  rows += `<tr class="total-row"><td colspan="3">${t('totalRow')}</td><td class="tax-amount">${formatDZD(totalTax)}</td></tr>`;
  rows += `<tr class="total-row" style="background:#fffbea;"><td colspan="3">${t('totalCostRow')}</td><td class="tax-amount" style="color:#92400e;">${formatDZD(totalCost)}</td></tr>`;
  document.getElementById('breakdownBody').innerHTML = rows;

  // Bar
  const segs = [
    { cls:'bar-cif',label:'CIF',value:cifDZD,color:'#94a3b8' },
    { cls:'bar-dd',label:'DD',value:dd,color:'#006233' },
    { cls:'bar-tcs',label:'TCS',value:tcs,color:'#3b82f6' },
  ];
  if(daps>0) segs.push({cls:'bar-daps',label:'DAPS',value:daps,color:'#8b5cf6'});
  segs.push({cls:'bar-tdb',label:'TDB',value:tdb,color:'#f59e0b'});
  segs.push({cls:'bar-tva',label:'TVA',value:tva,color:'#D21034'});
  let bH='',lH='';
  segs.forEach(s=>{const p=(s.value/totalCost)*100;if(p>2)bH+=`<div class="bar-segment ${s.cls}" style="width:${p}%">${p>=8?s.label:''}</div>`;else if(p>0.5)bH+=`<div class="bar-segment ${s.cls}" style="width:${Math.max(p,1.5)}%"></div>`;lH+=`<span><span class="dot" style="background:${s.color}"></span>${s.label}</span>`;});
  document.getElementById('taxBar').innerHTML=bH;
  document.getElementById('barLegend').innerHTML=lH;

  // EUR.1
  const eur1Box=document.getElementById('eur1Box');
  if(ddRate>0){eur1Box.style.display='block';const tvaE1=(cifDZD+tcs+daps)*tvaRate;const ttE1=tcs+daps+tdb+tvaE1;const sv=totalTax-ttE1;document.getElementById('eur1Savings').textContent=`-${formatDZD(dd)} DZD`;document.getElementById('eur1TvaSavings').textContent=`-${formatDZD(tva-tvaE1)} DZD`;document.getElementById('eur1TotalSavings').textContent=`-${formatDZD(sv)} DZD`;}else{eur1Box.style.display='none';}

  document.getElementById('results').classList.add('visible');
  setTimeout(()=>{document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});},100);
}

function resetForm() {
  document.getElementById('fobValue').value='';document.getElementById('freight').value='0';document.getElementById('insurance').value='0';
  document.getElementById('ddRate').value='5';document.getElementById('tvaRate').value='19';document.getElementById('dapsRate').value='0';
  document.getElementById('importType').value='goods';document.getElementById('currency').value='DZD';
  document.getElementById('results').classList.remove('visible');document.getElementById('dapsWarning').style.display='none';
}

function submitLead() {
  const name=document.getElementById('leadName').value.trim();
  const email=document.getElementById('leadEmail').value.trim();
  if(!name||!email){alert(t('alertLead'));return;}
  const company=document.getElementById('leadCompany').value.trim();
  const phone=document.getElementById('leadPhone').value.trim();
  const product=document.getElementById('leadProduct').value.trim();
  const cifVal=document.getElementById('cifDisplay')?document.getElementById('cifDisplay').textContent:'—';
  const taxVal=document.getElementById('totalTaxDisplay')?document.getElementById('totalTaxDisplay').textContent:'—';
  const subject=encodeURIComponent(t('emailSubject'));
  const body=encodeURIComponent(`Name: ${name}\nCompany: ${company||'N/A'}\nEmail: ${email}\nPhone: ${phone||'N/A'}\nProduct: ${product||'N/A'}\nCIF: ${cifVal}\nTax: ${taxVal}\nDate: ${new Date().toLocaleString()}`);
  window.location.href='mailto:izhaoguoxing@gmail.com?subject='+subject+'&body='+body;
  document.getElementById('leadModal').style.display='flex';
}

function closeLeadModal(){document.getElementById('leadModal').style.display='none';}

setLang('fr');
</script>
